spring:
  application:
    name: order-service
  
  # Database Configuration (Docker network)
  datasource:
    url: jdbc:mysql://order-db:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
  
  # Kafka Configuration (Docker network - use INTERNAL listener)
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: order-service-group

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms

# Server Configuration
server:
  port: 8080

# External Service URLs (Docker network)
product:
  service:
    url: http://product-service:8082
inventory:
  service:
    url: http://product-service:8082

# Logging Configuration
logging:
  level:
    root: INFO
    in.codefarm.order_service: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Suppress harmless static resource warnings
    org.springframework.web.servlet.resource.ResourceHttpRequestHandler: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

